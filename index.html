.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;margin-bottom:16px}

.card h3{margin:0 0 12px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:140px;height:140px;border-radius:50%;position:relative;cursor:pointer;transition:transform .25s ease,filter .25s ease}
.ring.hov{transform:scale(1.08);filter:drop-shadow(0 6px 10px rgba(16,24,40,.2))}
.ring::after{content:attr(data-t);position:absolute;inset:26px;background:var(--card);border-radius:50%;display:grid;place-items:center;text-align:center;white-space:pre;line-height:1.2;font-size:22px;font-weight:700;color:var(--hc,var(--navy));transition:font-size .2s}
.ring.hov::after{font-size:14px}
.lg div{display:flex;align-items:center;gap:8px;margin:2px 0;padding:3px 8px;border-radius:6px;transition:background .15s;cursor:default}
.lg div.hl{background:var(--bg2);font-weight:600}.lg i{width:10px;height:10px;border-radius:50%}
.bar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar div.t{height:10px;background:var(--bar);border-radius:5px;overflow:hidden}.bar div.t i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:5px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{text-align:right;font-weight:600;color:var(--navy)}
.months{display:flex;align-items:flex-end;gap:6px;height:150px}
.months div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.months i{display:block;width:100%;background:linear-gradient(180deg,var(--ac2),var(--ac));border-radius:5px 5px 0 0;min-height:2px}

/* ---------- table ---------- */
.tcard{padding:0;overflow:hidden;margin-bottom:16px}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.thead h3{margin:0}
.tw{overflow:auto;max-width:100%;max-height:640px}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;min-width:0;font-size:12.5px;background:transparent}
th,td{padding:9px 7px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
th{position:sticky;top:0;z-index:1;background:var(--bg2);font-size:11px;color:var(--thc);text-transform:uppercase;letter-spacing:.04em;padding:11px 7px;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line2);padding:11px 7px}
th:nth-child(1){width:4%}th:nth-child(2){width:5.5%}th:nth-child(3){width:5%}th:nth-child(4){width:8%}
th:nth-child(5){width:9%}th:nth-child(6){width:8.5%}th:nth-child(7){width:7.5%}th:nth-child(8){width:7.5%}
th:nth-child(9){width:18%}th:nth-child(10){width:10%}th:nth-child(11){width:8%}th:nth-child(12){width:9%}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:var(--hover)}
th:last-child,td.num{text-align:right}
td.num{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.dt{font-weight:600}.dt small{display:block;color:var(--mu);font-size:11px;font-weight:400}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word;color:var(--tx2)}
.pill{display:inline-block;padding:2px 6px;border-radius:6px;background:var(--pillbg);color:var(--pillc);font-family:ui-monospace,Consolas,monospace;font-size:11.5px;word-break:break-word}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--tagbg);color:var(--tagc);font-size:12px;font-weight:500;word-break:break-word}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--b);background:color-mix(in srgb,var(--b) 13%,var(--card));border:1px solid color-mix(in srgb,var(--b) 28%,var(--card))}
.badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--b);margin-right:6px;vertical-align:middle}
.sr{color:var(--mu);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mu);padding:30px}
@media(max-width:1000px){table{min-width:1000px}}

/* ---------- file links (pictures / videos) ---------- */
.lks{display:flex;flex-wrap:wrap;gap:4px}
.lk{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--tagbg);color:var(--tagc);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--card));font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.lk:hover{background:var(--ac);color:#fff;border-color:var(--ac)}

/* ---------- search summary ---------- */
.thead{flex-wrap:wrap}
.tabs{display:none;gap:4px;background:var(--bg2);border-radius:99px;padding:3px;margin-left:auto}
.tabs button{border:0;background:transparent;border-radius:99px;padding:4px 14px;font-weight:600;font-size:12px;color:var(--mu)}
.tabs button.on{background:var(--ac);color:#fff}
.sumhd{padding:14px 16px 0;font-weight:700;color:var(--navy);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sumline{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--mu);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px}
.sumline b{color:var(--navy);font-size:15px}
.stbl{table-layout:auto;min-width:680px!important;width:100%}
.stbl th{width:auto!important}
.sumsub{padding:14px 16px 8px;font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;border-top:1px solid var(--line)}
.stbl th.r,.stbl td.r{text-align:right}
.stbl td.r{font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy)}
.stbl tbody tr{cursor:default}
.stbl tr.tot td{background:var(--totbg);font-weight:700;color:var(--navy)}
.stbl tr.avg td{background:var(--avgbg);font-weight:700;color:var(--navy)}

/* ---------- print button + printable report ---------- */
#prt,#exp{flex:none;white-space:nowrap;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#prt:hover,#exp:hover{background:#0b5f58;color:#fff}
#pr{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 html,body{background:#fff!important;overflow:visible!important}
 .top,main,#modal{display:none!important}
 #pr{display:block;color:#000;font:11px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #pr .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0f766e;padding-bottom:8px;margin-bottom:8px}
 #pr .ph img{height:44px;width:auto;max-width:140px;object-fit:contain}
 #pr h2{margin:0;font-size:20px;color:#12305a}
 #pr h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#0f766e}
 #pr .pcs{margin:6px 0 10px}
 #pr .pc{display:inline-block;border:1px solid #0f766e;background:#e0f5f2;border-radius:99px;padding:1px 10px;margin:0 6px 4px 0;font-size:11px}
 #pr .ps{display:flex;gap:8px;margin-bottom:8px}
 #pr .ps div{flex:1;border:1px solid #999;border-radius:6px;padding:5px 10px}
 #pr .ps small{display:block;color:#555;font-size:10px}
 #pr .ps b{font-size:16px;color:#12305a}
 #pr .pst{margin-bottom:4px}
 #pr table{width:100%;border-collapse:collapse;table-layout:auto;font-size:10px;min-width:0}
 #pr th,#pr td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top;position:static}
 #pr th{background:#e8eef5;font-size:9.5px;text-transform:uppercase}
 #pr thead{display:table-header-group}
 #pr tr{page-break-inside:avoid}
 #pr .r{text-align:right;font-variant-numeric:tabular-nums}
 #pr table.pm{width:auto;min-width:300px}
 #pr tfoot td{background:#e0f5f2;font-weight:700}
}

/* ---------- request form (popup + print) ---------- */
#pf{display:none}
.mtb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
.mtb .p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.mtb .p:hover{background:#0b5f58;color:#fff}
.mtb #mwa{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#fff;border-color:#25D366;font-weight:600}
.mtb #mwa:hover{background:#1ebe5a;border-color:#1ebe5a;color:#fff}
.mtb #mwa svg{flex:none}
.mhint{font-size:11.5px;color:var(--mu);text-align:right;margin-bottom:10px}
.rf{border:1px solid #000;background:#fff;color:#000;font:13px/1.35 Arial,Helvetica,sans-serif}
.rfh{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:80px}
.rfh img{height:50px;width:auto;max-width:130px;object-fit:contain;flex:none}
.rftt{flex:1;text-align:center;color:#e11d1d;font-weight:700;font-size:19px}
.rfn{display:flex;justify-content:flex-end;gap:18px;padding:4px 40px 10px;font-size:11px}
.rfn span{color:#444;font-weight:700}
.rt{width:100%;min-width:0!important;border-collapse:collapse;table-layout:fixed;font-size:12px}
.rt th,.rt td{border:1px solid #000;padding:8px 6px;text-align:center;height:46px;word-break:break-word;overflow-wrap:anywhere;background:#fff;position:static}
.rt th{height:30px;font-weight:700;font-size:12px;text-transform:none;letter-spacing:0;color:#000}
.rt td.l{font-size:11.5px}
.rt td.iss{white-space:pre-wrap;vertical-align:middle;font-size:12.5px}
.rt tbody tr,.rt tr{cursor:default}
.rb{border-top:1px solid #000;padding:8px 6px;font-size:11.5px;display:flex;align-items:center;justify-content:flex-start;text-align:left}
.rb.q{height:42px}.rb.a{height:130px}.rb.c{height:62px}.rb.p{height:50px}.rb.m{height:42px}
/* single borders everywhere: overlap the table onto the outer box border */
.rt{width:calc(100% + 2px)!important;margin:0 -1px}
/* table's bottom border already draws the line, so skip the first block's top border */
.rt + .rb{border-top:0}
.rfd{font-size:10px;margin-top:10px;color:#000}
@media print{
 body.pf .top,body.pf main,body.pf #modal,body.pf #pr{display:none!important}
 body.pf #pf{display:block;page-break-after:avoid}
 /* form fills the whole A4 portrait page (297mm - 20mm margins = 277mm) */
 body.pf .rf{display:flex;flex-direction:column;width:100%;height:268mm;min-height:268mm;font-size:17px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.pf .rfh{flex:none;min-height:24mm}
 body.pf .rfh img{height:16mm;max-width:50mm}
 body.pf .rftt{font-size:25px;color:#e11d1d!important}
 body.pf .rfn{flex:none;font-size:14px;padding:1mm 8mm 2mm}
 body.pf .rt{flex:none;min-width:0!important;font-size:19px}
 body.pf .rt th{height:9mm;font-size:14px}
 body.pf .rt td{height:13mm;font-size:14px;padding:3px 6px}
 body.pf .rt td.iss{font-size:17px}
 body.pf .rb{flex:none;font-size:16px;padding:3mm;display:flex;align-items:center}
 body.pf .rb.q{height:20mm}
 body.pf .rb.a{flex:1 1 90mm;height:auto;min-height:90mm}
 body.pf .rb.c{height:16mm}
 body.pf .rb.p{height:15mm}
 body.pf .rb.m{height:16mm}
 body.pf .rfd{font-size:12px;margin-top:3mm}
}

/* ---------- PDF download layout (same look as print, single borders) ---------- */
/* outer frame = .rf border only; inside, cells draw only right+bottom lines (no collapsed borders) */
.pdfm,.pdfm *{color:#000}.pdfm .rftt{color:#e11d1d}
.pdfm{background:#fff;color:#000}
.pdfm tr,.pdfm tbody tr:nth-child(even){background:#fff!important}
.pdfm .rf{display:flex;flex-direction:column;width:100%;height:262mm;font-size:17px;border:1px solid #000}
.pdfm .rfh{flex:none;min-height:24mm;border:0}
.pdfm .rfh img{height:16mm;max-width:50mm}
.pdfm .rftt{font-size:25px}
.pdfm .rfn{flex:none;font-size:14px;padding:1mm 8mm 2mm;border:0}
.pdfm .pg{flex:none;display:grid;grid-template-columns:19fr 21fr 20fr 40fr;grid-template-rows:9mm repeat(5,13mm);border-top:1px solid #000}
.pdfm .pg+.rb{border-top:0}
.pdfm .pc{display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 6px;font-size:14px;color:#000;background:#fff;border-right:1px solid #000;border-bottom:1px solid #000;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.pdfm .pc.h{font-weight:700}
.pdfm .pc.c23{grid-column:2 / span 2}
.pdfm .pc.c4{border-right:0}
.pdfm .pc.iss{grid-column:4;grid-row:2 / span 5;border-right:0;font-size:17px;white-space:pre-wrap}
.pdfm .rb{flex:none;font-size:16px;padding:3mm;display:flex;align-items:center;border-left:0;border-right:0}
.pdfm .rb.q{height:20mm}
.pdfm .rb.a{flex:1 1 90mm;height:auto;min-height:90mm}
.pdfm .rb.c{height:16mm}
.pdfm .rb.p{height:15mm}
.pdfm .rb.m{height:16mm}
.pdfm .rfd{font-size:12px;margin-top:3mm}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
#modal h4{margin:14px 0 4px;color:var(--ac);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#modal p{margin:0;white-space:pre-wrap;word-break:break-word}
#msg{padding:12px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;margin-bottom:12px;display:none}

/* ---------- mobile: keep the frozen area compact ---------- */
@media(max-width:700px){
 header{padding:8px 12px}
 .logo{height:34px;max-width:100px}
 h1{font-size:15px}
 .hr{gap:8px}.clk b{font-size:12px}.clk span{font-size:11px}
 #ref{padding:6px 8px}
 .sub{font-size:11px}
 .topin{padding:8px 12px}

 .kpis::-webkit-scrollbar{display:none}

 main{padding:12px}
}

/* ---------- dark mode ---------- */
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--card:#131c2e;--line:#243148;--line2:#1d2940;--tx:#e6edf7;--tx2:#c3cee0;--mu:#8fa0b8;--ac:#14b8a6;--ac2:#2dd4bf;--navy:#d6e6ff;--bg2:#1a2538;--inp:#0f1727;--stripe:#162136;--hover:#1c3a40;--bar:#243148;--thc:#9fb0c8;--pillbg:#25305a;--pillc:#c7d2fe;--tagbg:#12403d;--tagc:#7ff0e0;--totbg:#12403d;--avgbg:#172a4a;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}
:root[data-theme=dark] #msg{background:#3b1517;border-color:#7f1d1d;color:#fca5a5}
:root[data-theme=dark] #msg.info{background:#3a2e10;border-color:#7a5c12;color:#fcd34d}
#msg.info{background:#fffbeb;border-color:#fde68a;color:#92400e}
#thm,#inst{flex:none;white-space:nowrap}
#thm{font-size:16px;line-height:1;padding:7px 10px}

/* ---------- date shortcuts ---------- */
.qd{display:flex;gap:6px;flex:none}
.qd .chip{white-space:nowrap}

/* ---------- loading animation ---------- */
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes slide{from{left:-35%}to{left:100%}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ac);animation:sp .8s linear infinite}
#boot{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--mu);font-weight:600;transition:opacity .35s}
#boot img{height:54px;width:auto;max-width:180px;object-fit:contain}
#boot div:last-child{animation:pulse 1.4s ease-in-out infinite}
#boot.off{opacity:0;pointer-events:none}
#bar{position:absolute;left:0;top:0;width:100%;height:3px;overflow:hidden;opacity:0;transition:opacity .2s;z-index:3;pointer-events:none}
#bar::before{content:"";position:absolute;top:0;bottom:0;left:-35%;width:35%;background:rgba(255,255,255,.85);border-radius:3px}
body.loading #bar{opacity:1}
body.loading #bar::before{animation:slide 1s ease-in-out infinite}
#ref .ri{display:inline-block}
body.loading #ref .ri{animation:sp .8s linear infinite}

/* ---------- keyboard focus ---------- */
tbody tr:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ---------- QR on the form ---------- */
.rfq{height:64px;width:64px;flex:none;image-rendering:pixelated}
.pdfm .rfq{height:20mm;width:20mm}
@media print{
 body.pf .rfq{height:20mm;width:20mm}
 #pr th,#pr td{color:#000!important}
 #pr tr{background:#fff!important}
}

}

/* CONFIG */
const SHEET_ID='1jKWKJ4oWsMNH-9qHyDEhUTCrA5CDNAQU9HAbTjOaTr0';
const GID='1560301324';
const LIMIT=400;        // variance flag (litres)
const DELAY_H=10;       // delayed threshold (hours)
const DUR_LONG=24;      // trip report long duration (hours)
const LOGO_SRC='logo.png';  // keep logo.png in the same folder as this file (or use a data:image/png;base64,... string)

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nk=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const pad=n=>String(n).padStart(2,'0');
const fmtN=n=>n==null?'':Math.round(n).toLocaleString('en-US')+' L';
const fmtNn=n=>n==null?'':Math.round(n).toLocaleString('en-US');   // number only, unit (L) is shown in the table header
const fdt=d=>d?`${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'';
const fdt2=d=>{if(!d)return '';const h=d.getHours();return `${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()} - ${pad(h%12||12)}:${pad(d.getMinutes())} ${h<12?'AM':'PM'}`};
const iso=d=>d?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:'';
const dur=h=>h==null?'':h<24?Math.round(h*10)/10+' h':Math.floor(h/24)+'d '+Math.round(h%24)+'h';

let ROWS=[], TR=[], TAB='stock', F={};

/* SHEET FETCH (JSONP) */
function fetchSheet(){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    let done=false;
    const fin=(f,v)=>{ if(done)return; done=true; clearTimeout(t); s.remove(); f(v); };
    const t=setTimeout(()=>fin(rej,new Error('timeout')),30000);
    window.google={visualization:{Query:{setResponse:r=>{
      if(r.status=='error'){ fin(rej,new Error((r.errors&&r.errors[0]&&(r.errors[0].detailed_message||r.errors[0].message))||'query error')); return; }
      fin(res, r.table);
    }}}};
    s.onload=()=>setTimeout(()=>fin(rej,new Error('sheet is not shared publicly')),100);
    s.onerror=()=>fin(rej,new Error('network error'));
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&tqx=out:json&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
const cell=c=>c?(c.f!=null?String(c.f):(c.v==null?'':String(c.v))):'';
const T=c=>cell(c).trim();
function dt(c){
  if(!c||c.v==null||c.v==='')return null;
  const m=String(c.v).match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?/);
  if(m)return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  const d=new Date(cell(c)); return isNaN(d)?null:d;
}
function num(c){
  if(!c)return null;
  if(typeof c.v=='number')return c.v;
  const m=cell(c).replace(/,/g,'').match(/\d+(?:\.\d+)?/g); if(!m)return null;
  return m.reduce((a,x)=>a+parseFloat(x),0);
}
const links=c=>[...new Set(cell(c).match(/https?:\/\/[^\s,;"'<>]+/g)||[])];
const fl=f=>String(f||'').replace(/[^\p{L}\p{N}\s.]/gu,'').trim();

/* BUILD ROWS & TRIPS (logic unchanged) */
function build(data){
  const S1=[],S2=[],S3=[];
  data.forEach(r=>{
    const c=r.c||[];
    const t=nk(cell(c[1]));
    if(t.startsWith('leaving')){
      S1.push({drv:T(c[2]),veh:T(c[3]),dep:dt(c[4]),term:T(c[5]),fuel:T(c[6]),
        qty:num(c[7]),dest:T(c[8]),po:T(c[9]),seal:T(c[10]),staff:T(c[11]),pic:links(c[12])});
    } else if(t.startsWith('stationarr')){
      S2.push({arr:dt(c[13]),fuel:T(c[14]),sup:T(c[15]),stn:T(c[16]),drv:T(c[17]),veh:T(c[18]),
        po:T(c[19]),seal:T(c[20]),aq:num(c[21]),meter:num(c[22]),rem:T(c[23]),media:links(c[24])});
    } else if(t.startsWith('fuelfin')){
      S3.push({fin:dt(c[25]),shift:T(c[26]),sup:T(c[27]),stn:T(c[28]),fuel:T(c[29])});
    }
  });

  const poFirstAramco = {}, poMeterTotals = {};
  S1.forEach(r => { if(r.po && r.qty > 0 && poFirstAramco[r.po] === undefined) poFirstAramco[r.po] = r.qty; });
  S2.forEach(r => {
    if(!r.po) return;
    if(poFirstAramco[r.po] === undefined && r.aq > 0) poFirstAramco[r.po] = r.aq;
    if(r.meter) poMeterTotals[r.po] = (poMeterTotals[r.po] || 0) + r.meter;
  });

  const ev = [];
  S3.forEach((f, i) => ev.push({ k: 'f', time: f.fin ? +f.fin : Infinity, o: f, idx: i }));
  S2.forEach((a, i) => ev.push({ k: 'a', time: a.arr ? +a.arr : Infinity, o: a, idx: i }));
  ev.sort((a,b) => (a.time - b.time) || (a.k === 'f' ? -1 : 1));

  let ongoing = {};
  const rows = [];
  ev.forEach(e => {
    if(e.k === 'f') {
      const f = e.o;
      ongoing[`${nk(f.stn)}|${nk(f.sup)}|${nk(f.fuel)}`] = f;
    } else {
      const s = e.o;
      const key = `${nk(s.stn)}|${nk(s.sup)}|${nk(s.fuel)}`;
      const f = ongoing[key];
      const po = s.po;
      let diff = null;
      if(po && poFirstAramco[po] != null && poMeterTotals[po] != null) diff = poMeterTotals[po] - poFirstAramco[po];
      let hrs = null;
      if(f && f.fin && s.arr) hrs = Math.round((s.arr - f.fin) / 360000) / 10;
      rows.push({
        kind:'arr', stn:s.stn, sup:s.sup, fuel:s.fuel,
        fin:f?f.fin:null, finShift:f?f.shift:'',
        arr:s.arr, resp:hrs, status:f?'Ok':'Normal',
        diff:diff, varf:diff!=null && Math.abs(diff)>LIMIT,
        drv:s.drv, veh:s.veh, po:po, loaded:po?poFirstAramco[po]:null,
        aq:s.aq, meter:s.meter, rem:s.rem, media:s.media
      });
      if(f) delete ongoing[key];
    }
  });
  for(let key in ongoing) {
    const f = ongoing[key];
    rows.push({kind:'fin', stn:f.stn, sup:f.sup, fuel:f.fuel, fin:f.fin, finShift:f.shift, arr:null, resp:null,
      status:'Finished', diff:null, varf:false, drv:'', veh:'', po:'', loaded:null, aq:null, meter:null, rem:'', media:[]});
  }

  const trips = new Map();
  S1.sort((a,b)=>(a.dep||0)-(b.dep||0)).forEach(s => {
    const k = nk(s.po) || ('v'+nk(s.veh)+s.dep);
    if(!trips.has(k)) trips.set(k, {po: s.po, s1: s, st: []});
  });
  S2.sort((a,b)=>(a.arr||0)-(b.arr||0)).forEach(s => {
    const k = nk(s.po);
    let t = trips.get(k);
    if(!t) {
      const vk = nk(s.veh); let best = null;
      trips.forEach(x => {
        if(x.s1 && nk(x.s1.veh)==vk && (!s.arr || !x.s1.dep || x.s1.dep<=s.arr) && (!best || x.s1.dep>best.s1.dep)) best=x;
      });
      if(best) { t=best; s.fb=true; }
    }
    if(!t) { t={po: s.po, s1:null, st:[]}; trips.set(k||('x'+trips.size), t); }
    t.st.push(s);
  });

  const now = new Date(), mk = d => d.getFullYear()*12+d.getMonth(), cm = mk(now);
  const cnt = {};
  trips.forEach(t => {
    const s = t.s1; if(!s||!s.dep)return;
    const k = nk(s.drv), m = mk(s.dep);
    cnt[k] = cnt[k] || [0,0];
    if(m == cm) cnt[k][0]++; else if(m == cm-1) cnt[k][1]++;
  });

  const TRr = [];
  trips.forEach((t,tk) => {
    const s = t.s1; if(!s) return;
    const c = cnt[nk(s.drv)] || [0,0];
    const base = {drv:s.drv, veh:s.veh, term:s.term, fuel:s.fuel, dep:s.dep,
      time:s.dep, po:t.po, cnt:t.st.length, m1:c[0], m2:c[1], dest:s.dest, seal:s.seal,
      staff:s.staff, pic:s.pic||[], nopic:!(s.pic&&s.pic.length), tid:tk, qty:s.qty};
    if(!t.st.length) {
      const hrs = s.dep ? (now-s.dep)/36e5 : null;
      TRr.push({...base, status:'On the Way', arr:null, dur:null, at:'', hrs, delayed:hrs!=null && hrs>DELAY_H});
      return;
    }
    t.st.forEach(x => {
      const durH = (x.arr && s.dep) ? Math.round((x.arr-s.dep)/36e3)/100 : null;
      const a = nk(x.stn), d = nk(s.dest);
      const route = !!(d && a && !(a.includes(d)||d.includes(a)));
      TRr.push({...base, status:route?'Route Changed':'Arrived', arr:x.arr, at:x.stn, dur:durH, route, aseal:x.seal, ameter:x.meter,
        sealMismatch:!!(s.seal && x.seal && nk(s.seal)!=nk(x.seal))});
    });
  });

  TRr.sort((a,b)=>(a.time||0)-(b.time||0)).forEach((r,i)=>{
    r.sl = i+1;
    r.long = r.dur != null && r.dur > DUR_LONG;
    r.fl = fl(r.fuel);
    r.stn = (r.dest||'')+' '+(r.at||'');
    r.hay = [r.po, r.drv, r.veh, r.term, r.fuel, r.dest, r.at, r.staff].filter(Boolean).join(' ').toLowerCase();
  });
  rows.forEach(r => {
    r.fl = fl(r.fuel);
    r.hay = [r.po, r.stn, r.sup, r.drv, r.veh, r.fuel, r.rem, r.dest, r.term].filter(Boolean).join(' ').toLowerCase();
  });
  return {rows, tr: TRr};
}

/* FILTER + SORT */
function matchBase(r,nd){
  const inc=(v,x)=>!v||String(x||'').toLowerCase().includes(v.toLowerCase());
  if(!inc($('q').value.trim(), r.hay)) return false;
  if(!inc($('fpo').value.trim(), r.po)) return false;
  if(!inc($('fveh').value.trim(), r.veh)) return false;
  if(!inc($('fdrv').value.trim(), r.drv)) return false;
  if(!inc($('fstn').value.trim(), r.stn)) return false;
  if(!inc($('fstaff').value.trim(), r.staff)) return false;
  if(nd!==2 && !inc($('fst').value.trim(), r.status)) return false;
  if(!inc($('ffuel').value.trim(), r.fl)) return false;
  const fv=nd===2?'':$('fflag').value.trim().toLowerCase();
  if(fv){
    const fe=Object.entries(TAB=='trip'?FLAGS2:FLAGS).filter(([k])=>k);
    const fo=fe.find(([k,v])=>v.toLowerCase()==fv)||fe.find(([k,v])=>v.toLowerCase().includes(fv));
    if(!fo) return false;
    const f=fo[0];
    if(f=='nometer'){ if(r.meter!=null||r.kind!='arr') return false; }
    else if(!r[f]) return false;
  }
  const d=iso(r.time||r.arr||r.fin);
  if(!nd && $('d1').value && (!d || d<$('d1').value)) return false;
  if(!nd && $('d2').value && (!d || d>$('d2').value)) return false;
  return true;
}
function sortF(a,b){
  const s=$('fsort').value;
  if(TAB=='trip'){
    if(s=='old') return (a.time||0)-(b.time||0);
    if(s=='dur') return (b.dur||0)-(a.dur||0);
    if(s=='trips')return b.m1-a.m1;
    return (b.time||0)-(a.time||0);
  }
  const ta=a.arr||a.fin, tb=b.arr||b.fin;
  if(s=='old') return (ta||0)-(tb||0);
  if(s=='qty') return (b.loaded||0)-(a.loaded||0);
  if(s=='var') return (b.diff==null?-1:Math.abs(b.diff))-(a.diff==null?-1:Math.abs(a.diff));
  if(s=='resp') return (b.resp||0)-(a.resp||0);
  const rank={Finished:1,Ok:2,Normal:3};
  const ra=rank[a.status]||4, rb=rank[b.status]||4;
  if(ra!==rb) return ra-rb;
  return (tb||0)-(ta||0);
}

/* NEW rows: rows that appeared since the previous refresh (marked for 30 min, flash once) */
const NEWTTL=30*60000,NEWM=new Map(),FLASH=new Set();let PREV=null;
const rKey=r=>r.kind?('s|'+r.kind+'|'+nk(r.stn)+'|'+nk(r.fuel)+'|'+(r.po||'')+'|'+(+(r.arr||r.fin)||0)):('t|'+r.tid+'|'+nk(r.at||''));
function detectNew(rows){const now=Date.now(),ks=rows.map(rKey);
  if(PREV){ks.forEach(k=>{if(!PREV.has(k)){NEWM.set(k,now);FLASH.add(k)}})}
  PREV=new Set(ks);
  NEWM.forEach((t,k)=>{if(now-t>NEWTTL)NEWM.delete(k)})}
const isNewR=r=>{const t=NEWM.get(rKey(r));return !!t&&Date.now()-t<=NEWTTL};
const nCls=r=>isNewR(r)?(' rnew'+(FLASH.has(rKey(r))?' rflash':'')):'';
/* LAST 24 HOURS: a row is tinted if its request/finish (fin), supply/arrival (arr) or trip departure (dep) is within 24 h */
const in24=d=>!!d&&(Date.now()-d)<=864e5;
const r24=r=>in24(r.fin)||in24(r.arr)||in24(r.dep);
const h24On=()=>$('fsort').value=='h24';

/* freeze the first N columns: Supply = SL..Fuel (4), Trip = SL..Departure (7) */
function freeze(){
  const w=document.querySelector('.tw'), t=w&&w.querySelector('table'); if(!t)return;
  t.querySelectorAll('.fz').forEach(c=>{c.classList.remove('fz','fzl');c.style.left=''});
  if(matchMedia('(max-width:900px)').matches) return;   // phones: rows are laid out to fit the width, nothing to freeze
  const n=TAB=='trip'?3:4, ths=[...t.tHead.rows[0].cells].slice(0,n);
  const ws=ths.map(h=>h.getBoundingClientRect().width);
  if(ws.reduce((a,b)=>a+b,0)>w.clientWidth*0.6) return;  // too narrow a screen: skip freezing
  const rows=[...t.tBodies[0].rows]; let x=0;
  ws.forEach((cw,i)=>{
    [ths[i],...rows.map(r=>r.cells[i])].forEach(c=>{ if(!c)return; c.classList.add('fz'); if(i==n-1)c.classList.add('fzl'); c.style.left=x+'px'; });
    x+=cw;
  });
}

const fmtD=v=>{if(!v)return'';const[y,m,d]=v.split('-');return `${d} ${MON[+m-1]} ${y}`};
const inR=d=>{if(!d)return false;const x=iso(d),a=$('d1').value,b=$('d2').value;return(!a||x>=a)&&(!b||x<=b)};
function calcSum(src,Tr){
  const R={n:0,l:0,fin:0,f:{'91':{n:0,l:0},'95':{n:0,l:0},d:{n:0,l:0},o:{n:0,l:0}},st:new Map()},seen=new Set();
  const stn=name=>{const k=nk(name)||'-';let o=R.st.get(k);if(!o){o={name:name||'—',n:0,l:0,fin:0,f:{'91':0,'95':0,d:0,o:0}};R.st.set(k,o)}return o};
  const add=(name,fx,l)=>{const o=stn(name);o.n++;o.l+=l;o.f[fx]+=l;R.n++;R.l+=l;R.f[fx].n++;R.f[fx].l+=l};
  src.forEach(r=>{
    if(!matchBase(r,2))return;
    const fx=fk(r.fuel)||'o';
    if(Tr){ if(r.dep&&inR(r.dep)&&!seen.has(r.tid)){seen.add(r.tid);add(r.dest,fx,r.qty||0)} }
    else{
      if(isArr(r)&&inR(r.arr))add(r.stn,fx,r.meter||0);
      if(r.fin&&inR(r.fin)){R.fin++;stn(r.stn).fin++}
    }
  });
  return R;
}

<script>
/* ===== The two dashboards are stored as readable text in the two blocks above (src-truck, src-trip) ===== */
function src(id){return document.getElementById(id).textContent.trim()
  .replace(/<scr§ipt/g,'<script').replace(/<\/scr§ipt/g,'</script').replace(/<!§--/g,'<!--').replace(/<\/bo§dy/g,'</body').replace(/<\/ht§ml/g,'</html')}
var APPS={truck:src('src-truck'),trip:src('src-trip')};

/* ===== Tabs ===== */
var TABS=[
  {id:'truck',frame:'truck',title:'Truck Maintenance',h:['🚛','Truck ','Maintenance',' Dashboard']},
  {id:'stock',frame:'trip',inner:'stock',title:'Supply & Finish',h:['⛽','Supply ','&amp; Finish',' Dashboard']},
  {id:'trip', frame:'trip',inner:'trip',title:'Trip Report',h:['🛣','Trip ','Report',' Dashboard']}
];

var BRAND='<svg class="mi" viewBox="0 0 52 30" width="44" height="26" aria-hidden="true"><rect x="17" y="3" width="31" height="16" rx="8" fill="var(--ac)"/><rect x="22" y="0.8" width="7" height="3.4" rx="1.2" fill="var(--ac)"/><path d="M2 19V10a2 2 0 0 1 2-2h7l5 6v5z" fill="var(--navy)"/><path d="M6 10.5h4l3 3.5H6z" fill="var(--card)"/><rect x="2" y="19" width="46" height="2.6" rx="1.2" fill="var(--navy)"/><path d="M32.5 6.5c2.2 2.8 3.6 4.4 3.6 6.2a3.6 3.6 0 0 1-7.2 0c0-1.8 1.4-3.4 3.6-6.2z" fill="#fff"/><g fill="var(--navy)" stroke="var(--card)" stroke-width="1.5"><circle cx="10" cy="22.5" r="4"/><circle cx="31" cy="22.5" r="4"/><circle cx="42" cy="22.5" r="4"/></g><g fill="var(--card)"><circle cx="10" cy="22.5" r="1.4"/><circle cx="31" cy="22.5" r="1.4"/><circle cx="42" cy="22.5" r="1.4"/></g></svg><b class="mn">Marona <span>Transport</span></b>';
var CUR=null, PENDING={};   // PENDING[frame] = inner tab to select once that frame has loaded

function frameEl(n){return $('f-'+n)}
function tabById(id){return TABS.filter(function(t){return t.id===id})[0]}

  var t=tabById(CUR); if(!t) return; var f=frameEl(t.frame),w=null; try{w=f.contentWindow.__rx}catch(e){}

function loadFrame(n){
  var f=frameEl(n); if(f.dataset.loaded) return;
  f.dataset.loaded='1';

  // Do NOT wait for the iframe "load" event: it waits for every font/CDN file and can hang on slow networks.
  // Instead wire up as soon as the page's own HTML has been parsed, with a hard time limit as safety net.
  var tries=0, iv=setInterval(function(){
    tries++; var d; try{d=f.contentDocument}catch(e){}
    if(d && d.URL==='about:srcdoc' && d.readyState!=='loading' && d.body){ clearInterval(iv); onLoaded(n); }

function onLoaded(n){

  f.dataset.ready='1'; updateLoader();

  try{d=f.contentDocument}catch(e){return}

  }catch(e){}
  applyTheme(document.documentElement.dataset.theme,null,n);

/* ===== Theme sync (dark/light toggle in any dashboard changes all of them) ===== */
function applyTheme(t,from,only){
  if(!t) return;
  document.documentElement.dataset.theme=t;
  $('mthm').textContent=t=='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',t)}catch(e){}
  ['truck','trip'].forEach(function(n){
    if(n===from || (only && n!==only)) return;
    var f=frameEl(n); if(!f.dataset.loaded) return;
    try{
      var w=f.contentWindow, d=f.contentDocument;
      if(d.documentElement.dataset.theme!==t){
        if(typeof w.setTheme==='function') w.setTheme(t); else d.documentElement.dataset.theme=t;
      }
    }catch(e){}
  });
}

/* More menu: open/close (all buttons inside keep their original ids and handlers) */
function closeMore(){$('mmenu').hidden=true;$('mmore').setAttribute('aria-expanded','false')}
$('mmore').onclick=function(e){e.stopPropagation();var h=$('mmenu').hidden;$('cp').hidden=true;$('mmenu').hidden=!h;this.setAttribute('aria-expanded',h?'true':'false')};
$('mmenu').addEventListener('click',function(e){if(e.target.closest('button'))closeMore()},true);
document.addEventListener('click',closeMore);
addEventListener('blur',closeMore);
addEventListener('keydown',function(e){if(e.key==='Escape')closeMore()});
addEventListener('keydown',function(e){var a=document.activeElement,t=a&&a.tagName;if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT|IFRAME/.test(t||''))return;
 if(e.key==='/'){try{var d=frameEl(tabById(CUR).frame).contentDocument,i=d.querySelector('input[type=search],input[type=text],input:not([type])');if(i){e.preventDefault();i.focus()}}catch(x){}}
 else if(e.key==='f'||e.key==='F')$('mfs').click()});

function RXw(){try{return frameEl(tabById(CUR).frame).contentWindow.__rx||null}catch(e){return null}}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2600)}
function escH(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('mexp').onclick=function(){var r=RXw();if(!r)return toast('Dashboard is still loading…');var n=r.export();toast(n?'Exported '+n+' rows (CSV – opens in Excel)':'Nothing to export')};
$('msum').onclick=function(){var r=RXw();if(!r)return toast('Dashboard is still loading…');$('smt').value=r.summary();$('sm').hidden=false};
$('smx').onclick=function(){$('sm').hidden=true};
$('sm').onclick=function(e){if(e.target===this)this.hidden=true};
$('smc').onclick=function(){var v=$('smt').value,ok=function(){toast('Summary copied')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(ok,function(){$('smt').select();document.execCommand('copy');ok()});else{$('smt').select();document.execCommand('copy');ok()}};
$('smw').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent($('smt').value),'_blank')};
function drawCols(){var r=RXw(),p=$('cp'),c=r?r.cols():[];
  p.innerHTML='<b>Show columns</b>'+(c.length?c.map(function(x,i){return'<label><input type="checkbox" data-n="'+i+'"'+(x.hidden?'':' checked')+'> '+escH(x.name||'(blank)')+'</label>'}).join('')+'<button id="cpr">Show all</button>':'<i>No table on this view</i>');
  p.onchange=function(e){var i=e.target.dataset.n;if(i!=null){r.setCol(c[i].name,!e.target.checked);drawCols()}};
  var b=$('cpr');if(b)b.onclick=function(){r.setCol(null);drawCols()}}
$('mcol').onclick=function(e){e.stopPropagation();var p=$('cp');if(!p.hidden){p.hidden=true;return}if(!RXw())return toast('Dashboard is still loading…');drawCols();p.hidden=false};
$('cp').onclick=function(e){e.stopPropagation()};
document.addEventListener('click',function(){$('cp').hidden=true});
addEventListener('keydown',function(e){if(e.key==='Escape'){$('sm').hidden=true;$('cp').hidden=true}});
function hm(t){var d=new Date(t),h=d.getHours();return pad(h%12||12)+':'+pad(d.getMinutes())+' '+(h<12?'AM':'PM')}
function stale(){var r=RXw(),b=$('stale'),m='',k='';
  if(r){var off=navigator.onLine===false,age=r.loaded?Math.round((Date.now()-r.lastOk)/60000):0;
   if(r.err||off){k='err';m=(off?'You are offline':'Could not refresh')+' — showing older data'+(r.loaded?' (last updated '+hm(r.lastOk)+')':'')+'.'}
   else if(r.loaded&&age>=10){k='warn';m='Data may be outdated — last updated '+hm(r.lastOk)+' ('+age+' min ago).'}}
  b.hidden=!m;b.className=k;$('stm').textContent=m}
setInterval(stale,3000);addEventListener('online',stale);addEventListener('offline',stale);
/* "Updated 08:50 AM" / "Refreshing…" stamp beside LIVE (follows the tab you are on) */
function stamp(){
  var r=RXw(),f=null,ld=false,txt='',cls='mupd';
  try{f=frameEl(tabById(CUR).frame)}catch(e){}
  try{var d=f.contentDocument;ld=d.body.classList.contains('loading')||/loading/i.test((d.getElementById('ref')||{}).textContent||'')}catch(e){}
  if(ld){txt='Refreshing…';cls+=' busy'}
  else if(r&&r.loaded){txt='Updated '+hm(r.lastOk);if(Date.now()-r.lastOk>=360000)cls+=' old'}
  ['mupd','mupd2'].forEach(function(id){var el=$(id);if(el){if(el.textContent!==txt)el.textContent=txt;if(el.className!==cls)el.className=cls}});
}
setInterval(stamp,1000);stamp();
$('str').onclick=function(){$('mref').click();setTimeout(stale,2500)};
/* auto refresh: each dashboard already reloads the sheet every 5 min; this catches up if a timer was paused
   (sleeping computer, background tab, phone locked) by refreshing any dashboard whose data is older than 5 min */
function autoRefresh(){
  if(document.hidden||navigator.onLine===false) return;
  ['truck','trip'].forEach(function(n){
    var f=frameEl(n); if(!f.dataset.wired) return;
    try{
      var w=f.contentWindow.__rx;
      if(w&&w.loaded&&Date.now()-w.lastOk>330000){ var b=f.contentDocument.getElementById('ref'); if(b&&!/loading/i.test(b.textContent)) b.click(); }
    }catch(e){}
  });
}
setInterval(autoRefresh,30000);
document.addEventListener('visibilitychange',autoRefresh);
addEventListener('online',autoRefresh);
console.info('Reben master dashboard v14');
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)){
    // local testing (Live Server): remove old service workers/caches left by other dashboards on this address, so you always see the newest file
    navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})}).catch(function(){});
    if(window.caches) caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})}).catch(function(){});
  } else navigator.serviceWorker.register('sw.js').catch(function(){});
}

/* ===== Start: QR / shared links first, then #tab, then last used tab ===== */
(function start(){
  var q=new URLSearchParams(location.search), id=null;
  var f=q.get('f');
  if(q.get('req')) id='truck';                         // old truck QR:  ?req=123
  else if(f&&f.indexOf('trip:')===0) id='trip';        // old trip QR:   ?f=trip:PO
  else if(f&&f.indexOf('stock:')===0) id='stock';      // old supply QR: ?f=stock:PO
  if(!id){ var h=(location.hash||'').slice(1); if(tabById(h)) id=h; }
  if(!id){ try{ var l=localStorage.getItem('lastTab'); if(tabById(l)) id=l }catch(e){} }
  show(id||'truck');
  window.__REBEN_OK=1;
})();
</script>
